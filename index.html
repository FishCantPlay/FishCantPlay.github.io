<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fish Heard — Game Designer & Artist</title>

    <style>

        /* =========================
           COLOUR PALETTE
           ========================= */

        :root {
            --black: #050707;
            --background: #080D0D;

            --teal-dark: #025043;
            --teal: #036C5F;
            --teal-light: #078C7C;

            --pink-dark: #9C3F57;
            --pink: #E88FA6;

            --text: #F1E8E5;
            --text-muted: #B6C0BD;
        }


        /* =========================
           BASIC PAGE
           ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--background);

            color: var(--text);

            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           MOVING BACKGROUND BLOBS
           ========================= */

        .blob {
            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;

            filter: blur(90px);

            opacity: 0.7;
        }


        /* Large pink blob */

        .blob-pink {
            width: 520px;
            height: 520px;

            background: rgba(232, 143, 166, 0.38);

            top: -180px;
            left: -160px;

            animation: pinkMovement 18s ease-in-out infinite alternate;
        }


        /* Large teal blob */

        .blob-teal {
            width: 600px;
            height: 600px;

            background: rgba(3, 108, 95, 0.42);

            right: -200px;
            bottom: -220px;

            animation: tealMovement 22s ease-in-out infinite alternate;
        }


        /* Small pink blob */

        .blob-pink-small {
            width: 300px;
            height: 300px;

            background: rgba(156, 63, 87, 0.28);

            right: 15%;
            top: 15%;

            animation: pinkSmallMovement 25s ease-in-out infinite alternate;
        }


        /* Small teal blob */

        .blob-teal-small {
            width: 350px;
            height: 350px;

            background: rgba(2, 80, 67, 0.32);

            left: 20%;
            bottom: 5%;

            animation: tealSmallMovement 20s ease-in-out infinite alternate;
        }


        /* =========================
           PINK BLOB MOVEMENT
           ========================= */

        @keyframes pinkMovement {

            0% {
                transform:
                    translate(0px, 0px)
                    scale(1);
            }

            25% {
                transform:
                    translate(180px, 80px)
                    scale(1.15);
            }

            50% {
                transform:
                    translate(350px, 20px)
                    scale(0.9);
            }

            75% {
                transform:
                    translate(250px, 220px)
                    scale(1.2);
            }

            100% {
                transform:
                    translate(500px, 150px)
                    scale(1);
            }
        }


        /* =========================
           TEAL BLOB MOVEMENT
           ========================= */

        @keyframes tealMovement {

            0% {
                transform:
                    translate(0px, 0px)
                    scale(1);
            }

            25% {
                transform:
                    translate(-160px, -100px)
                    scale(1.15);
            }

            50% {
                transform:
                    translate(-350px, -40px)
                    scale(0.9);
            }

            75% {
                transform:
                    translate(-250px, -250px)
                    scale(1.2);
            }

            100% {
                transform:
                    translate(-500px, -120px)
                    scale(1);
            }
        }


        /* =========================
           SMALL PINK BLOB MOVEMENT
           ========================= */

        @keyframes pinkSmallMovement {

            0% {
                transform:
                    translate(0px, 0px)
                    scale(1);
            }

            30% {
                transform:
                    translate(-180px, 160px)
                    scale(1.3);
            }

            60% {
                transform:
                    translate(-80px, 350px)
                    scale(0.8);
            }

            100% {
                transform:
                    translate(200px, 220px)
                    scale(1.15);
            }
        }


        /* =========================
           SMALL TEAL BLOB MOVEMENT
           ========================= */

        @keyframes tealSmallMovement {

            0% {
                transform:
                    translate(0px, 0px)
                    scale(1);
            }

            30% {
                transform:
                    translate(200px, -120px)
                    scale(1.25);
            }

            60% {
                transform:
                    translate(350px, -250px)
                    scale(0.85);
            }

            100% {
                transform:
                    translate(100px, -350px)
                    scale(1.2);
            }
        }


        /* =========================
           MAIN HERO
           ========================= */

        main {
            position: relative;

            z-index: 1;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;
        }


        /* =========================
           MAIN TITLE
           ========================= */

        h1 {
            margin: 0;

            font-size: clamp(60px, 10vw, 140px);

            color: var(--teal-light);

            letter-spacing: -5px;

            -webkit-text-stroke: 1px var(--text);

            text-shadow:
                4px 4px 0 var(--teal-dark),
                0 0 25px rgba(3, 108, 95, 0.3);
        }


        /* =========================
           SUBTITLE
           ========================= */

        .subtitle {
            margin-top: 15px;

            font-size: 24px;

            color: var(--pink);

            letter-spacing: 2px;

            -webkit-text-stroke: 0.4px var(--text);

            text-shadow:
                0 0 12px rgba(232, 143, 166, 0.2);
        }


        /* =========================
           INTRODUCTION
           ========================= */

        .intro {
            max-width: 600px;

            margin-top: 30px;

            color: var(--text-muted);

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           ENTER PORTFOLIO BUTTON
           ========================= */

        .button {
            display: inline-block;

            margin-top: 35px;

            padding: 14px 28px;

            background: var(--teal);

            color: var(--text);

            text-decoration: none;

            border: 2px solid var(--teal-light);

            border-radius: 3px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        .button:hover {
            background: var(--pink);

            color: var(--black);

            border-color: var(--text);

            transform:
                translateY(-5px)
                rotate(-2deg);
        }


        /* =========================
           SOCIAL MEDIA LINKS
           ========================= */

        .socials {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 28px;

            margin-top: 30px;

            flex-wrap: wrap;
        }


        .socials a {
            position: relative;

            color: var(--text-muted);

            font-size: 15px;

            letter-spacing: 1px;

            text-decoration: none;

            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }


        /* Little pink underline */

        .socials a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 0;
            height: 2px;

            background: var(--pink);

            transition:
                width 0.25s ease;
        }


        /* Social link hover */

        .socials a:hover {
            color: var(--pink);

            transform: translateY(-3px);
        }


        .socials a:hover::after {
            width: 100%;
        }


        /* =========================
           DECORATIVE LINE
           ========================= */

        .divider {
            width: 120px;

            height: 3px;

            margin-top: 45px;

            background: var(--pink-dark);

            box-shadow:
                0 0 12px rgba(156, 63, 87, 0.3);
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .blob {
                filter: blur(70px);
            }


            main {
                padding: 25px;
            }


            /*

                MOBILE TITLE FIX

                The normal -webkit-text-stroke can cause
                weird rendering artefacts on some phones.

                So on mobile we remove it and recreate
                the thin outline using text-shadow.

            */

            h1 {
                letter-spacing: -2px;

                -webkit-text-stroke: 0;

                text-shadow:
                    -1px -1px 0 var(--text),
                     1px -1px 0 var(--text),
                    -1px  1px 0 var(--text),
                     1px  1px 0 var(--text),
                     4px  4px 0 var(--teal-dark),
                     0 0 25px rgba(3, 108, 95, 0.3);
            }


            /* Mobile subtitle */

            .subtitle {
                font-size: 17px;

                -webkit-text-stroke: 0;

                text-shadow:
                    -0.5px -0.5px 0 var(--text),
                     0.5px -0.5px 0 var(--text),
                    -0.5px  0.5px 0 var(--text),
                     0.5px  0.5px 0 var(--text),
                     0 0 12px rgba(232, 143, 166, 0.2);
            }


            /* Mobile introduction */

            .intro {
                font-size: 16px;
            }


            /* Mobile social links */

            .socials {
                gap: 18px;

                margin-top: 25px;
            }


            .socials a {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MOVING BACKGROUND BLOBS
         ========================= -->

    <div class="blob blob-pink"></div>

    <div class="blob blob-teal"></div>

    <div class="blob blob-pink-small"></div>

    <div class="blob blob-teal-small"></div>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>


        <!-- NAME -->

        <h1>
            Fish Heard
        </h1>


        <!-- JOB TITLE -->

        <div class="subtitle">
            GAME DESIGNER &amp; ARTIST
        </div>


        <!-- INTRODUCTION -->

        <p class="intro">
            I create games, characters and strange little worlds
            somewhere between cute, unsettling and a little bit weird.
        </p>


        <!-- ENTER PORTFOLIO -->

        <a
            href="#work"
            class="button"
        >
            ENTER PORTFOLIO
        </a>


        <!-- =========================
             SOCIAL MEDIA
             ========================= -->

        <div class="socials">

            <a
                href="https://bsky.app/profile/fishcantplay.bsky.social"
                target="_blank"
                rel="noopener noreferrer"
            >
                Bluesky
            </a>

            <a
                href="https://www.tiktok.com/@fishcantplay"
                target="_blank"
                rel="noopener noreferrer"
            >
                TikTok
            </a>

            <a
                href="https://www.youtube.com/channel/UCaDKDHI5PpZDd8WhXMEVYtQ"
                target="_blank"
                rel="noopener noreferrer"
            >
                YouTube
            </a>

            <a
                href="https://www.artstation.com/fishcantdraw"
                target="_blank"
                rel="noopener noreferrer"
            >
                ArtStation
            </a>

        </div>


        <!-- DECORATIVE LINE -->

        <div class="divider"></div>


    </main>

</body>

</html>
