<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fish Heard — Game Designer & Artist</title>

    <style>

        /* =========================
           COLOUR PALETTE
           ========================= */

        :root {
            --black: #050707;
            --background: #080D0D;

            --teal-dark: #025043;
            --teal: #036C5F;
            --teal-light: #078C7C;

            --pink-dark: #9C3F57;
            --pink: #E88FA6;

            --text: #F1E8E5;
            --text-muted: #B6C0BD;
        }


        /* =========================
           BASIC PAGE
           ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 100vh;

            color: var(--text);

            font-family: Arial, sans-serif;

            background-color: var(--background);

            overflow-x: hidden;
        }


        /* =========================
           MOVING BACKGROUND
           ========================= */

        body::before,
        body::after {
            content: "";

            position: fixed;

            width: 55vw;
            height: 55vw;

            max-width: 800px;
            max-height: 800px;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(80px);

            z-index: -1;
        }


        /* Pink blob */

        body::before {
            top: -20%;
            left: -15%;

            background:
                radial-gradient(
                    circle,
                    rgba(232, 143, 166, 0.30) 0%,
                    rgba(156, 63, 87, 0.18) 30%,
                    transparent 70%
                );

            animation: pinkFloat 18s ease-in-out infinite alternate;
        }


        /* Teal blob */

        body::after {
            bottom: -20%;
            right: -15%;

            background:
                radial-gradient(
                    circle,
                    rgba(3, 108, 95, 0.40) 0%,
                    rgba(2, 80, 67, 0.20) 35%,
                    transparent 70%
                );

            animation: tealFloat 22s ease-in-out infinite alternate;
        }


        /* =========================
           BACKGROUND ANIMATIONS
           ========================= */

        @keyframes pinkFloat {

            0% {
                transform:
                    translate(0px, 0px)
                    scale(1);
            }

            50% {
                transform:
                    translate(80px, 50px)
                    scale(1.15);
            }

            100% {
                transform:
                    translate(20px, 120px)
                    scale(0.95);
            }

        }


        @keyframes tealFloat {

            0% {
                transform:
                    translate(0px, 0px)
                    scale(1);
            }

            50% {
                transform:
                    translate(-100px, -60px)
                    scale(1.12);
            }

            100% {
                transform:
                    translate(-30px, -120px)
                    scale(0.92);
            }

        }


        /* =========================
           EXTRA SMALL LIGHT
           ========================= */

        .background-light {
            position: fixed;

            width: 35vw;
            height: 35vw;

            max-width: 500px;
            max-height: 500px;

            border-radius: 50%;

            top: 20%;
            right: 5%;

            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    rgba(232, 143, 166, 0.10) 0%,
                    rgba(3, 108, 95, 0.08) 30%,
                    transparent 70%
                );

            filter: blur(90px);

            z-index: -1;

            animation: softFloat 26s ease-in-out infinite alternate;
        }


        @keyframes softFloat {

            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-100px, 80px) scale(1.2);
            }

            100% {
                transform: translate(70px, -50px) scale(0.9);
            }

        }


        /* =========================
           MAIN HERO
           ========================= */

        main {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;
        }


        /* =========================
           MAIN TITLE
           ========================= */

        h1 {
            margin: 0;

            font-size: clamp(60px, 10vw, 140px);

            color: var(--teal-light);

            letter-spacing: -5px;

            -webkit-text-stroke: 1px var(--text);

            text-shadow:
                4px 4px 0 var(--teal-dark),
                0 0 25px rgba(3, 108, 95, 0.25);
        }


        /* =========================
           SUBTITLE
           ========================= */

        .subtitle {
            margin-top: 15px;

            font-size: 24px;

            color: var(--pink);

            letter-spacing: 2px;

            -webkit-text-stroke: 0.4px var(--text);

            text-shadow:
                0 0 12px rgba(232, 143, 166, 0.15);
        }


        /* =========================
           INTRODUCTION
           ========================= */

        .intro {
            max-width: 600px;

            margin-top: 30px;

            color: var(--text-muted);

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           ENTER BUTTON
           ========================= */

        .button {
            display: inline-block;

            margin-top: 35px;

            padding: 14px 28px;

            background: var(--teal);

            color: var(--text);

            text-decoration: none;

            border: 2px solid var(--teal-light);

            border-radius: 3px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        .button:hover {
            background: var(--pink);

            color: var(--black);

            border-color: var(--text);

            transform:
                translateY(-5px)
                rotate(-2deg);
        }


        /* =========================
           DECORATIVE LINE
           ========================= */

        .divider {
            width: 120px;

            height: 3px;

            margin-top: 45px;

            background: var(--pink-dark);

            box-shadow:
                0 0 12px rgba(156, 63, 87, 0.3);
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            main {
                padding: 25px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .subtitle {
                font-size: 17px;
            }

            .intro {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <!-- Extra atmospheric background light -->
    <div class="background-light"></div>


    <main>

        <h1>Fish Heard</h1>

        <div class="subtitle">
            GAME DESIGNER & ARTIST
        </div>

        <p class="intro">
            I create games, characters and strange little worlds
            somewhere between cute, unsettling and a little bit weird.
        </p>

        <a href="#work" class="button">
            ENTER PORTFOLIO
        </a>

        <div class="divider"></div>

    </main>

</body>

</html>
