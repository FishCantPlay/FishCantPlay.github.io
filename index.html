
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fish Heard — Game Designer & Artist</title>

    <style>

        /* =========================
           COLOUR PALETTE
           ========================= */

        :root {
            --black: #050707;
            --background: #080D0D;

            --teal-dark: #025043;
            --teal: #036C5F;
            --teal-light: #078C7C;

            --pink-dark: #9C3F57;
            --pink: #E88FA6;

            --text: #F1E8E5;
            --text-muted: #B6C0BD;
        }


        /* =========================
           BASIC PAGE
           ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 100vh;

            color: var(--text);

            font-family: Arial, sans-serif;

            /* Black base with subtle coloured glows */
            background-color: var(--background);

            background-image:
                radial-gradient(
                    ellipse at 18% 20%,
                    rgba(156, 63, 87, 0.32) 0%,
                    rgba(156, 63, 87, 0.12) 20%,
                    transparent 50%
                ),

                radial-gradient(
                    ellipse at 82% 72%,
                    rgba(3, 108, 95, 0.38) 0%,
                    rgba(3, 108, 95, 0.13) 25%,
                    transparent 58%
                ),

                radial-gradient(
                    ellipse at 75% 15%,
                    rgba(232, 143, 166, 0.08) 0%,
                    transparent 45%
                );
        }


        /* =========================
           MAIN HERO
           ========================= */

        main {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;
        }


        /* =========================
           MAIN TITLE
           ========================= */

        h1 {
            margin: 0;

            font-size: clamp(60px, 10vw, 140px);

            color: var(--teal-light);

            letter-spacing: -5px;

            /* Soft off-white outline */
            -webkit-text-stroke: 1px var(--text);

            text-shadow:
                4px 4px 0 var(--teal-dark),
                0 0 25px rgba(3, 108, 95, 0.25);
        }


        /* =========================
           SUBTITLE
           ========================= */

        .subtitle {
            margin-top: 15px;

            font-size: 24px;

            color: var(--pink);

            letter-spacing: 2px;

            /* Slight white outline */
            -webkit-text-stroke: 0.4px var(--text);

            text-shadow:
                0 0 12px rgba(232, 143, 166, 0.15);
        }


        /* =========================
           INTRODUCTION
           ========================= */

        .intro {
            max-width: 600px;

            margin-top: 30px;

            color: var(--text-muted);

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           ENTER BUTTON
           ========================= */

        .button {
            display: inline-block;

            margin-top: 35px;

            padding: 14px 28px;

            background: var(--teal);

            color: var(--text);

            text-decoration: none;

            border: 2px solid var(--teal-light);

            border-radius: 3px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        .button:hover {
            background: var(--pink);

            color: var(--black);

            border-color: var(--text);

            transform: translateY(-5px) rotate(-2deg);
        }


        /* =========================
           DECORATIVE LINE
           ========================= */

        .divider {
            width: 120px;

            height: 3px;

            margin-top: 45px;

            background: var(--pink-dark);

            box-shadow:
                0 0 12px rgba(156, 63, 87, 0.3);
        }


        /* =========================
           MOBILE ADJUSTMENTS
           ========================= */

        @media (max-width: 600px) {

            main {
                padding: 25px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .subtitle {
                font-size: 17px;
            }

            .intro {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <main>

        <h1>Fish Heard</h1>

        <div class="subtitle">
            GAME DESIGNER & ARTIST
        </div>

        <p class="intro">
            I create games, characters and strange little worlds
            somewhere between cute, unsettling and a little bit weird.
        </p>

        <a href="#work" class="button">
            ENTER PORTFOLIO
        </a>

        <div class="divider"></div>

    </main>

</body>

</html>
