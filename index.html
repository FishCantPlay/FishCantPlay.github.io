<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fish Heard — Game Designer & Artist</title>

    <style>

        /* =========================
           COLOUR PALETTE
           ========================= */

        :root {
            --black: #050707;
            --background: #0A1111;
            --background-light: #10201F;

            --teal-dark: #025043;
            --teal: #036C5F;
            --teal-light: #078C7C;

            --pink-dark: #9C3F57;
            --pink: #E88FA6;

            --text: #F1E8E5;
            --text-muted: #9EAEAA;
        }


        /* =========================
           BASIC PAGE
           ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);

            font-family: Arial, sans-serif;

            min-height: 100vh;
        }


        /* =========================
           MAIN HERO
           ========================= */

        main {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;
        }


        h1 {
            margin: 0;

            font-size: clamp(60px, 10vw, 140px);

            color: var(--teal-light);

            letter-spacing: -5px;

            text-shadow:
                4px 4px 0 var(--teal-dark);
        }


        .subtitle {
            margin-top: 15px;

            font-size: 24px;

            color: var(--pink);

            letter-spacing: 2px;
        }


        .intro {
            max-width: 600px;

            margin-top: 30px;

            color: var(--text-muted);

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           BUTTON
           ========================= */

        .button {
            display: inline-block;

            margin-top: 35px;

            padding: 14px 28px;

            background: var(--teal);

            color: var(--text);

            text-decoration: none;

            border: 2px solid var(--teal-light);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }


        .button:hover {
            background: var(--pink);

            color: var(--black);

            transform: translateY(-5px) rotate(-2deg);
        }


        /* =========================
           LITTLE DECORATIVE LINE
           ========================= */

        .divider {
            width: 120px;

            height: 3px;

            margin-top: 45px;

            background: var(--pink-dark);
        }

    </style>

</head>


<body>

    <main>

        <h1>Fish Heard</h1>

        <div class="subtitle">
            GAME DESIGNER & ARTIST
        </div>

        <p class="intro">
            I create games, characters and strange little worlds
            somewhere between cute, unsettling and a little bit weird.
        </p>

        <a href="#work" class="button">
            ENTER PORTFOLIO
        </a>

        <div class="divider"></div>

    </main>

</body>

</html>
